<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forklift Pre-Shift Checklist | Foundry Shift</title>
    <link rel="stylesheet" href="../../css/Styless.css">
</head>
<body class="forklift-page" data-background-music-track="EngineSound.mp3" data-background-music-title="Forklift engine">
    <header class="topbar">
        <a class="brand" href="../Start.html">FOUNDRY <span>/ SHIFT</span></a>
        <span class="page-label">PRE-SHIFT CHECK</span>
    </header>
    <main class="checklist-page">
        <a class="back-link backgroundBox-Forklift" href="../Start.html">&#8592; Back to safety briefing</a>
        <section class="checklist-heading backgroundBox-Forklift-Text">
            <p class="eyebrow">FORKLIFT · BEFORE OPERATION</p>
            <h1>Check it before<br>you <em>drive it.</em></h1>
            <p class="intro">Walk around the truck and confirm each item is safe. Do not operate a forklift with a fault.</p>
        </section>
        <details class="inspection-panel" open>
            <summary>Forklift checklist</summary>
            <form class="inspection-list">
                <label class="inspection-item"><input type="checkbox" id="tires-wheels" disabled><span class="checkmark" aria-hidden="true"></span><span><strong>Tires and wheels</strong><small>Check for damage, wear, and secure wheel nuts.</small></span></label>
                <label class="inspection-item"><input type="checkbox" id="forks-mast" disabled><span class="checkmark" aria-hidden="true"></span><span><strong>Forks and mast</strong><small>Look for cracks, bends, and secure locking pins.</small></span></label>
                <label class="inspection-item"><input type="checkbox" id="lights-horn-alarms" disabled><span class="checkmark" aria-hidden="true"></span><span><strong>Lights, horn, and alarms</strong><small>Confirm warning lights and audible signals work.</small></span></label>
                
                
                
            </form>
        </details>
        <div class="image-container">
            <img class="forklift-image" src="../../images/forklift.png" alt="Forklift illustration">
  
        <!-- Wheel hotspots -->
            <div class="clickable-boxes">
                <button type="button" class="wheel-box wheel-box--front" aria-label="Front wheel"></button>
                <button type="button" class="wheel-box wheel-box--rear" aria-label="Rear wheel"></button>
                <button type="button" class="Forks ForkMast" aria-label="Forks"></button>
                <button type="button" class="Mast ForkMast" aria-label="Mast"></button>
                <button type="button" class="Horn" aria-label="Horn"></button>

            </div>
            
        </div>
        <div class="Drive-Container">
                <button type="button" class="Drive">Drive</button>
        </div>
    </main>
    <script src="../../JavaScript/Forklift.js"></script>
    <script src="../../JavaScript/BackgroundMusic.js" defer></script>
</body>
</html>
