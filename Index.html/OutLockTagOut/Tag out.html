<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lockout Checklist | Foundry Shift</title>
    <link rel="stylesheet" href="Forklift.css">
</head>
<body>
    <header class="topbar">
        <a class="brand" href="../Start.html">FOUNDRY <span>/ SHIFT</span></a>
        <span class="page-label">PRE-SHIFT CHECK</span>
    </header>
    <main class="checklist-page">
        <a class="back-link" href="../Start.html">&#8592; Back to safety briefing</a>
        <section class="checklist-heading">
            <p class="eyebrow">FORKLIFT · BEFORE OPERATION</p>
            <h1>Check it before<br>you <em>drive it.</em></h1>
            <p class="intro">Walk around the truck and confirm each item is safe. Do not operate a forklift with a fault.</p>
        </section>
        <form class="inspection-list">
            <label class="inspection-item"><input type="checkbox"><span class="checkmark" aria-hidden="true"></span><span><strong>Tires and wheels</strong><small>Check for damage, wear, and secure wheel nuts.</small></span></label>
            <label class="inspection-item"><input type="checkbox"><span class="checkmark" aria-hidden="true"></span><span><strong>Forks and mast</strong><small>Look for cracks, bends, and secure locking pins.</small></span></label>
            <label class="inspection-item"><input type="checkbox"><span class="checkmark" aria-hidden="true"></span><span><strong>Hydraulics and chains</strong><small>Check for leaks, wear, or damaged lift chains.</small></span></label>
            <label class="inspection-item"><input type="checkbox"><span class="checkmark" aria-hidden="true"></span><span><strong>Brakes and steering</strong><small>Test service brake, parking brake, and steering response.</small></span></label>
            <label class="inspection-item"><input type="checkbox"><span class="checkmark" aria-hidden="true"></span><span><strong>Lights, horn, and alarms</strong><small>Confirm warning lights and audible signals work.</small></span></label>
            <label class="inspection-item"><input type="checkbox"><span class="checkmark" aria-hidden="true"></span><span><strong>Seat belt and overhead guard</strong><small>Check the restraint and guard are present and secure.</small></span></label>
            <label class="inspection-item"><input type="checkbox"><span class="checkmark" aria-hidden="true"></span><span><strong>Fuel or battery</strong><small>Check fuel level or battery charge and connections.</small></span></label>
            <label class="inspection-item"><input type="checkbox"><span class="checkmark" aria-hidden="true"></span><span><strong>Travel path</strong><small>Make sure the route is clear and the floor is stable.</small></span></label>
        </form>
        <p class="safety-note"><span aria-hidden="true">!</span> Found a problem? Park safely, lower the forks, and report it. Do not use the truck.</p>
    </main>
    <script src="LOTO.js"></script>
</body>
</html>
